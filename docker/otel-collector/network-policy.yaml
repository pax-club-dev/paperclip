# Kubernetes NetworkPolicy for the OTel Collector
# Per CISO §5.2: Inbound only from agent CIDR on OTLP port.
#
# Apply: kubectl apply -f network-policy.yaml
#
# For GCP Cloud Run: use VPC Connectors + firewall rules instead
# (see comments at bottom of file).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-policy
  namespace: pax-system
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: pax-audit-trail
    security.pax.io/policy: ciso-5.2
spec:
  podSelector:
    matchLabels:
      app: otel-collector

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow OTLP/gRPC from Paperclip server pods only
    - from:
        - podSelector:
            matchLabels:
              app: paperclip-server
        # Also allow from specific agent CIDR if agents send traces directly
        - ipBlock:
            cidr: "${AGENT_CIDR:-10.0.0.0/8}"
            except:
              - 10.0.0.0/24  # Exclude management subnet
      ports:
        - protocol: TCP
          port: 4317  # OTLP gRPC

    # Allow health check probes from the cluster
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 13133  # Health check

  egress:
    # Allow export to Paperclip trace storage
    - to:
        - podSelector:
            matchLabels:
              app: paperclip-server
      ports:
        - protocol: TCP
          port: 3100  # Paperclip API

    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Resource limits for the OTel collector pod
# Per CISO §5.2: Resource limits to prevent resource exhaustion attacks.
apiVersion: v1
kind: Pod
metadata:
  name: otel-collector
  namespace: pax-system
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: pax-audit-trail
spec:
  # Security context at pod level
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: otel-collector
      image: ghcr.io/pax-club-org/pax-otel-collector:latest
      ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: health
          containerPort: 13133
          protocol: TCP

      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

      livenessProbe:
        httpGet:
          path: /health
          port: health
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /health
          port: health
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 2

      volumeMounts:
        - name: collector-config
          mountPath: /etc/otel-collector/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: tls-certs
          mountPath: /etc/otel-collector/certs
          readOnly: true
        - name: tmp
          mountPath: /tmp

      env:
        - name: DEPLOYMENT_ENVIRONMENT
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: COLLECTOR_VERSION
          value: "0.104.0"
        - name: PAPERCLIP_TRACE_STORAGE_ENDPOINT
          value: "paperclip-server.pax-system.svc.cluster.local:3100"
        - name: OTLP_EXPORTER_INSECURE
          value: "false"
        - name: GOMAXPROCS
          value: "2"
        - name: GOMEMLIMIT
          value: "400MiB"

  volumes:
    - name: collector-config
      configMap:
        name: otel-collector-config
    - name: tls-certs
      secret:
        secretName: otel-collector-tls
        defaultMode: 0400
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi

  # Pod-level DNS policy
  dnsPolicy: ClusterFirst

  # Tolerate brief node pressure — audit data is important
  priorityClassName: system-cluster-critical

  # Anti-affinity: don't colocate with Paperclip server for blast radius isolation
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: paperclip-server
            topologyKey: kubernetes.io/hostname

# ---
# GCP Cloud Run / VPC equivalent:
#
# For Cloud Run deployment, use:
#   - VPC Connector to place collector in a private VPC
#   - GCP Firewall rule: allow TCP:4317 from Paperclip server IP range only
#   - Cloud Run ingress: "internal" (no public access)
#   - Cloud Run min-instances: 1 (avoid cold start for audit data)
#   - Cloud Run max-instances: 2 (cost control + resource limits)
#   - Cloud Run memory: 512Mi, CPU: 1
#
# gcloud run deploy otel-collector \
#   --image ghcr.io/pax-club-org/pax-otel-collector:latest \
#   --platform managed \
#   --region us-central1 \
#   --ingress internal \
#   --vpc-connector pax-vpc-connector \
#   --memory 512Mi \
#   --cpu 1 \
#   --min-instances 1 \
#   --max-instances 2 \
#   --port 4317 \
#   --no-allow-unauthenticated \
#   --set-env-vars "DEPLOYMENT_ENVIRONMENT=production,COLLECTOR_VERSION=0.104.0"
