# Docker Compose overlay — OTel Collector for audit trail
# Per CISO §5.2: Hardened collector deployment
#
# Usage (with base stack):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.otel.yml up
#
# Or standalone for dev (collector + paperclip server):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.otel.yml up
#
# Generate dev mTLS certs first:
#   ./docker/otel-collector/generate-dev-certs.sh

services:
  otel-collector:
    build:
      context: ./otel-collector
      dockerfile: Dockerfile
    image: pax-otel-collector:latest
    ports:
      - "4317:4317"    # OTLP gRPC (mTLS)
      - "13133:13133"  # Health check
    environment:
      DEPLOYMENT_ENVIRONMENT: "local"
      COLLECTOR_VERSION: "0.104.0"
      PAPERCLIP_TRACE_STORAGE_ENDPOINT: "server:3100"
      OTLP_EXPORTER_INSECURE: "true"  # For local dev without TLS to Paperclip
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector/config.yaml:ro
      - ./otel-collector/certs:/etc/otel-collector/certs:ro
    # Resource limits (CISO §5.2)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    # Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    # Security options
    security_opt:
      - no-new-privileges:true
    # Non-root
    user: "65532:65532"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:13133/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - otel-internal

  # Override the server service to connect to the collector
  server:
    environment:
      PAPERCLIP_AUDIT_TRAIL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "paperclip-server"
      PAPERCLIP_AUDIT_SIGNING_ENABLED: "true"
    depends_on:
      otel-collector:
        condition: service_healthy
    networks:
      - otel-internal

networks:
  otel-internal:
    driver: bridge
    internal: false  # Set to true in production to isolate from public
    ipam:
      config:
        - subnet: 172.28.0.0/24
